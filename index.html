<style>
/* Layout: toolbar; left tabs (library / phases / findings) | elastic timeline board with sticky phase ruler and lane header | device preview + inspector. */
:root{

  --accent:#c81e66; --accent-fg:#ffffff; --spine:#8a8296;
  --c-core:#2b5fc7; --c-care:#0b7f74; --c-evo:#c81e66; --c-gig:#a96500; --c-ach:#6b3fc4; --c-notif:#2a7d34; --c-link:#0878a6; --c-cap:#1d1a22; --c-branch:#c81e66;
  --l-plain:#7a7388; --l-unlock:#1f8f45; --l-trig:#c81e66; --l-req:#b36b00; --l-sick:#cf3a2c; --l-cure:#0b7f74;
  --s-progress:#1f63d6; --s-placeholder:#b36b00; --s-planned:#6b3fc4; --s-idea:#7a7388; --s-unused:#cf3a2c;
  --term-bg:#0b130e; --term-fg:#57ee86; --cap-bg:#17141d; --cap-fg:#ffe45e; --dev:#2a2631; --scr:#000000;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110f15; --surface:#1a171f; --surface2:#221f29; --fg:#eeebf3; --muted:#a29bb0; --line:#343040; --tint:#1e1b24;
  --accent:#ff5c9f; --accent-fg:#1a0610; --spine:#6f6880;
  --c-core:#7aa2ff; --c-care:#3fd6c4; --c-evo:#ff5c9f; --c-gig:#f4b840; --c-ach:#ae93ff; --c-notif:#6ddb78; --c-link:#52c3f2; --c-cap:#eeebf3; --c-branch:#ff5c9f;
  --l-plain:#9a93aa; --l-unlock:#47c76f; --l-trig:#ff5c9f; --l-req:#f0a63a; --l-sick:#ff6a5a; --l-cure:#3fd6c4;
  --s-progress:#6ea0ff; --s-placeholder:#f0a63a; --s-planned:#ae93ff; --s-idea:#9a93aa; --s-unused:#ff6a5a;
  --dev:#38333f;

:root[data-theme="dark"]{
  --bg:#110f15; --surface:#1a171f; --surface2:#221f29; --fg:#eeebf3; --muted:#a29bb0; --line:#343040; --tint:#1e1b24;
  --accent:#ff5c9f; --accent-fg:#1a0610; --spine:#6f6880;
  --c-core:#7aa2ff; --c-care:#3fd6c4; --c-evo:#ff5c9f; --c-gig:#f4b840; --c-ach:#ae93ff; --c-notif:#6ddb78; --c-link:#52c3f2; --c-cap:#eeebf3; --c-branch:#ff5c9f;
  --l-plain:#9a93aa; --l-unlock:#47c76f; --l-trig:#ff5c9f; --l-req:#f0a63a; --l-sick:#ff6a5a; --l-cure:#3fd6c4;
  --s-progress:#6ea0ff; --s-placeholder:#f0a63a; --s-planned:#ae93ff; --s-idea:#9a93aa; --s-unused:#ff6a5a;
  --dev:#38333f;
  color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--font-b);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{font-weight:500;font-size:12px;padding:5px 9px;border:1px solid var(--line);background:var(--surface);border-radius:5px;cursor:pointer}
button:hover:not(:disabled){background:var(--surface2);border-color:var(--spine)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.danger{color:var(--l-sick)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:12px;min-width:0}
textarea{width:100%;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{height:100%;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bar label{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:12px}
.bar input[type=number]{width:62px}
.bar input[type=range]{width:100px;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button+button{border-left:1px solid var(--line)}
.brand{font:700 17px var(--font-d);letter-spacing:-.01em;margin-right:4px}
.brand span{color:var(--accent)}
#status{font:500 11px var(--font-m);color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:20px}

.main{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr) 270px;gap:10px}
.panel{min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.panel h3{margin:0 0 8px;font:700 14px var(--font-d)}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{flex:1;padding:5px 4px}
#q{width:100%;margin-bottom:6px}
.sum{font:500 11px var(--font-m);color:var(--muted);margin-bottom:6px}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:7px 0;font:600 12px var(--font-d);display:flex;align-items:center;gap:7px;list-style:none}
summary::-webkit-details-marker{display:none}
summary em{margin-left:auto;font:400 10.5px var(--font-m);color:var(--muted);font-style:normal}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.li{display:block;width:100%;text-align:left;margin:0 0 4px;padding:5px 8px;position:relative;background:var(--surface2)}
.li .lt{display:block;font-weight:600;font-size:12px;padding-right:24px}
.li .ls{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
.li .n{position:absolute;right:7px;top:6px;font:500 10px var(--font-m);color:var(--accent)}
.li.placed{background:transparent}
.stamp{margin:10px 0 0;font:400 10px var(--font-m);color:var(--muted)}

.phc{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;background:var(--surface2)}
.phc .ph-top{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.phc .ph-top input{flex:1;font-weight:600}
.phc .rng{font:400 10.5px var(--font-m);color:var(--muted);margin:4px 0 6px}
.tri{display:flex;align-items:center;gap:4px}
.tri input{width:100%}
.tri em{font:400 11px var(--font-m);font-style:normal;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px}

.fd{font-size:12px;line-height:1.45}
.fd h4{margin:12px 0 6px;font:700 12.5px var(--font-d)}
.fd ol{margin:0;padding-left:18px;display:grid;gap:6px}
.fd code{font:400 11px var(--font-m)}
.tw{overflow-x:auto}
.fd table{border-collapse:collapse;font-size:11px;width:100%}
.fd th,.fd td{text-align:left;padding:4px 5px;border-bottom:1px solid var(--line);vertical-align:top}
.fd th{font-weight:600;color:var(--muted)}

#scroller{position:relative;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
#hdr{position:sticky;top:0;z-index:12;height:28px;background:var(--surface);border-bottom:1px solid var(--line)}
#hdr .corner{position:sticky;left:0;width:124px;height:27px;background:var(--surface);border-right:1px solid var(--line);z-index:2;font:500 10px var(--font-m);color:var(--muted);display:flex;align-items:center;padding-left:8px}
#hdr .lane{position:absolute;top:0;height:27px;display:flex;align-items:center;gap:6px;font:600 11px var(--font-d);color:var(--muted);white-space:nowrap}
#stage{position:relative}
#ruler{position:sticky;left:0;width:124px;z-index:10;background:var(--surface);border-right:1px solid var(--line);touch-action:none;cursor:pointer}
.spine{position:absolute;right:13px;top:0;bottom:0;width:2px;background:var(--spine)}
.pstrip{position:absolute;left:0;width:22px;background:var(--tint);border-right:1px solid var(--line);overflow:hidden}
.pstrip.alt{background:color-mix(in srgb,var(--accent) 9%,var(--tint))}
.pstrip span{position:absolute;left:3px;top:8px;writing-mode:vertical-rl;font:600 10.5px var(--font-d);white-space:nowrap;color:var(--fg)}
.tick{position:absolute;right:22px;transform:translateY(-50%);font:400 10px var(--font-m);color:var(--muted);white-space:nowrap;pointer-events:none}
.tick::after{content:"";position:absolute;right:-8px;top:50%;width:6px;border-top:1px solid var(--spine)}
.tick.maj{color:var(--fg);font-weight:500}
.grip{position:absolute;left:0;right:0;height:14px;margin-top:-7px;cursor:ns-resize;z-index:3;display:flex;align-items:center;justify-content:flex-end;padding-right:22px}
.grip::before{content:"";position:absolute;left:22px;right:0;top:6px;border-top:2px solid var(--accent)}
.grip b{position:relative;font:500 10px var(--font-m);background:var(--accent);color:var(--accent-fg);padding:0 6px;border-radius:8px}
.grip:hover b,.grip.act b{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.pin{position:absolute;right:9px;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;border:2px solid var(--surface);pointer-events:none}
.pin.dim{opacity:.25}
#phk{position:absolute;left:22px;right:0;height:0;z-index:4;pointer-events:none}
#phk::before{content:"";position:absolute;right:0;top:-6px;border:6px solid transparent;border-right:9px solid var(--fg)}
#phk i{position:absolute;left:4px;top:-9px;font:600 10px var(--font-m);font-style:normal;background:var(--fg);color:var(--bg);padding:1px 5px;border-radius:8px;white-space:nowrap}
.hov{position:absolute;right:22px;transform:translateY(-50%);font:500 10px var(--font-m);background:var(--surface);border:1px solid var(--line);color:var(--fg);padding:0 6px;border-radius:9px;pointer-events:none;white-space:nowrap;z-index:5}
#board{position:absolute;left:0;top:0}
#svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:1}
#lbls{position:absolute;left:0;top:0;z-index:6}
#phl{position:absolute;left:0;height:0;border-top:2px solid var(--fg);z-index:7;pointer-events:none;opacity:.8}
.ptint{fill:var(--tint)}
.pdiv{stroke:var(--accent);stroke-width:1;stroke-dasharray:8 5;opacity:.55}
.dayl{stroke:var(--line);stroke-width:1}
.teth{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}

.blk{position:absolute;width:176px;background:var(--surface2);border:1px solid color-mix(in srgb,var(--cc) 50%,var(--line));border-radius:6px;padding:6px 8px 7px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;z-index:2;transition:opacity .15s}
.blk:hover{border-color:var(--cc)}
.blk.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:4}
.blk.dim{opacity:.22}
.blk .hd{display:flex;justify-content:space-between;gap:6px;font:500 9.5px var(--font-m);letter-spacing:.06em;text-transform:uppercase;color:var(--cc)}
.blk .tm{color:var(--muted);letter-spacing:0}
.blk .row{display:flex;gap:6px;align-items:center;margin-top:3px}
.blk .ttl{font:600 12.5px/1.25 var(--font-d);overflow-wrap:anywhere}
.blk .sub{font-size:10.5px;line-height:1.3;color:var(--muted);margin-top:2px}
.blk .note{font-size:10.5px;line-height:1.3;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.chip{display:inline-block;margin-top:5px;font:500 9.5px var(--font-m);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:9px;border:1px solid var(--sc);color:var(--sc)}
.chip.idea{border-style:dashed}
.blk.cap{background:var(--cap-bg);border-color:#4a4358}
.blk.cap .hd{color:#b9b2c9}
.blk.cap .note{color:#d9d3e6;border-color:#4a4358}
.px{font:700 12px/1.45 var(--font-px);color:var(--cap-fg);text-align:center;white-space:pre-wrap;padding:7px 2px 3px;overflow-wrap:anywhere}
.blk.nt{background:var(--term-bg);border-color:#1f6b3a}
.blk.nt .hd{color:#7fd69a}
.blk.nt .sub{color:#6fae84}
.blk.nt .note{color:#9be8b3;border-color:#1f6b3a}
.term{font:400 10.5px/1.45 var(--font-m);color:var(--term-fg);white-space:pre-wrap;overflow-wrap:anywhere}
.blk.br{border-style:dashed;border-color:var(--accent);border-radius:18px;text-align:center}
.blk.br .hd{justify-content:center;gap:8px;color:var(--accent)}
.port{position:absolute;right:-7px;top:50%;margin-top:-7px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--muted);cursor:crosshair;opacity:0;transition:opacity .12s}
.blk:hover .port,.blk.sel .port{opacity:1}
@media (hover:none){.port{opacity:1}}

.lk{fill:none;stroke-width:1.6;stroke-linecap:round}
.lk-plain{stroke:var(--l-plain)}
.lk-unlock{stroke:var(--l-unlock)}
.lk-trig{stroke:var(--l-trig);stroke-dasharray:7 4}
.lk-req{stroke:var(--l-req);stroke-dasharray:1.5 4}
.lk-sick{stroke:var(--l-sick);stroke-dasharray:10 3 2 3;stroke-width:2}
.lk-cure{stroke:var(--l-cure);stroke-dasharray:4 3;stroke-width:2}
.lk.sel{stroke-width:3.4}
.lk.dim,.lbl.dim{opacity:.15}
.lk.tmp{opacity:.7}
.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.mk-unlock{fill:var(--l-unlock)}.mk-trig{fill:var(--l-trig)}.mk-req{fill:var(--l-req)}.mk-sick{fill:var(--l-sick)}.mk-cure{fill:var(--l-cure)}
.lbl{position:absolute;transform:translate(-50%,-50%);font:500 10px var(--font-m);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.lbl.sel{border-color:var(--accent)}

#right{display:flex;flex-direction:column;gap:12px}
.pvh{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pvh h3{margin:0}
.devw{display:flex;justify-content:center}
.dev{border:1px solid var(--line,#888);padding:0}
.scrw{width:176px;height:312px;overflow:hidden;border-radius:3px}
.scr{width:135px;height:240px;background:var(--scr);position:relative;transform:scale(1.3037);transform-origin:0 0;overflow:hidden;font-family:var(--font-px);color:#fff}
.sbar{position:absolute;left:0;right:0;top:0;height:14px;display:flex;justify-content:space-between;align-items:center;padding:0 3px;font-size:6.5px;color:#ccc;border-bottom:1px solid #444}
.queen{position:absolute;left:42px;top:80px;width:50px;height:50px;border:1.5px solid #fff;border-radius:50%}
.queen.ill{border-color:#ff6a5a}
.sname{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:7px;color:#ffe45e}
.scond{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:6.5px;color:#7fd69a}
.scond.bad{color:#ff6a5a}
.rip{position:absolute;left:0;right:0;top:96px;text-align:center;font-size:12px;color:#c9c3d6}
.ov-band{position:absolute;left:0;right:0;top:63px;min-height:40px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:7.5px;line-height:1.6;white-space:pre-wrap;padding:6px 4px}
.ov-band.evo{color:#ff7fb6;border-top:1px solid #ff7fb6;border-bottom:1px solid #ff7fb6}
.ov-con{position:absolute;left:4px;right:4px;top:18px;bottom:18px;background:#020a05;border:1px solid #1f8f45;padding:5px;font-family:var(--font-m);font-size:7px;line-height:1.45;color:#57ee86;white-space:pre-wrap;overflow:hidden}
.ov-from{color:#9be8b3}
.jr{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:12px}
.jr dt{color:var(--muted)}
.jr dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.nx{margin-top:8px}
.nx b{display:block;font:600 11px var(--font-d);color:var(--muted);margin-bottom:4px}
.nx button{display:flex;width:100%;justify-content:space-between;gap:8px;margin-bottom:3px;text-align:left;background:var(--surface2)}
.nx button span:last-child{font:400 10.5px var(--font-m);color:var(--muted);white-space:nowrap}
.pnote{font-size:11px;color:var(--muted);margin:6px 0 0}
#insp{border-top:1px solid var(--line);padding-top:10px}
.f{display:block;margin:0 0 9px;font-size:11px;color:var(--muted)}
.f>input,.f>select,.f>textarea{display:block;width:100%;margin-top:3px;color:var(--fg)}
.f .tri{margin-top:3px}
.hint{color:var(--muted);font-size:12px;margin:0 0 10px}
.lg{display:flex;align-items:center;gap:8px;font-size:12px;margin:0 0 5px}
.lg svg{flex:none}
.ttag{font:500 10px var(--font-m);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin:0 0 8px;color:var(--muted)}

#modal{position:fixed;inset:0;z-index:50;background:rgba(10,8,14,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
.mbox h3{margin:0;font:700 15px var(--font-d)}
#jtxt{height:min(320px,45vh);font:400 11px/1.4 var(--font-m);white-space:pre;overflow:auto}
#jmsg{margin:0;font-size:12px;color:var(--muted);min-height:1em}

@media (max-width:980px){
  html,body{height:auto}
  .app{height:auto}
  .main{display:flex;flex-direction:column}
  #scroller{height:70vh;order:1}
  #right{order:2}
  #lib{order:3;max-height:70vh}
}
@media (prefers-reduced-motion:reduce){.port,.blk{transition:none}}
</style>

function geom(a,b){
  var A=R(a),B=R(b),p1,p2,c1,c2,k;
  if(B.y>=A.y+A.h-6){p1=[A.x+A.w/2,A.y+A.h];p2=[B.x+B.w/2,B.y];k=Math.max(30,Math.min(140,(p2[1]-p1[1])/2));c1=[p1[0],p1[1]+k];c2=[p2[0],p2[1]-k]}
  else if(B.y+B.h<=A.y+6){p1=[A.x+A.w/2,A.y];p2=[B.x+B.w/2,B.y+B.h];k=Math.max(30,Math.min(140,(p1[1]-p2[1])/2));c1=[p1[0],p1[1]-k];c2=[p2[0],p2[1]+k]}
  else{var r=B.x>A.x;p1=[r?A.x+A.w:A.x,A.y+A.h/2];p2=[r?B.x:B.x+B.w,B.y+B.h/2];k=Math.max(30,Math.min(100,Math.abs(p2[0]-p1[0])/2))*(r?1:-1);c1=[p1[0]+k,p1[1]];c2=[p2[0]-k,p2[1]]}
  return{d:'M'+p1+'C'+c1+' '+c2+' '+p2,mx:(p1[0]+3*c1[0]+3*c2[0]+p2[0])/8,my:(p1[1]+3*c1[1]+3*c2[1]+p2[1])/8};
}

function journey(now){
  var list=S.blocks.filter(onPath).map(function(b){return{b:b,t:bT(b)}}).sort(function(a,c){return a.t-c.t});
  var j={ev:'e1',evName:'Baby Queen',mood:'ok',until:0,dead:false,gigs:[],next:[]};
  list.forEach(function(o){
    if(o.t>now){if(j.next.length<4)j.next.push(o);return}
    var b=o.b,k=b.key||'';
    if(k==='birth'||k==='reborn'){j.ev='e1';j.evName='Baby Queen';j.dead=false;j.mood='ok';}
    if(b.ev){j.ev=b.ev;j.evName=b.title}
    if(k==='sick'){j.mood='sick';j.until=o.t+360}
    if(k==='crit'||k==='warn'||k==='reaper'){j.mood='critical';j.until=o.t+360}
    if(k==='i_pen'||k==='i_tonic'){j.mood='ok'}
    if(k==='death')j.dead=true;
    if(b.cat==='gig'&&/^g\d$/.test(k)&&j.gigs.indexOf(b.title)<0)j.gigs.push(b.title);
  });
  if(j.mood!=='ok'&&now>j.until)j.mood='ok';
  return j;
}

  if(!playing)return;
  var dt=lastTs?Math.min(.1,(ts-lastTs)/1000):0;lastTs=ts;
  var prev=S.play,y=yOfT(prev)+(H-2*PAD)/S.speed*dt,end=G[G.length-1].top+G[G.length-1].h;
  if(y>=end){S.play=TOT}else S.play=hitY(y).t;
  S.blocks.forEach(function(b){if(!onPath(b)||!eventful(b))return;var t=bT(b);if((t>prev||(prev===0&&t===0&&dt===0))&&t<=S.play)queue.push({b:b,t:t})});
  queue.sort(function(a,c){return a.t-c.t});if(queue.length>4)queue=queue.slice(-4);
  placePlay();
  var py=yOfT(S.play)+28,top=scroller.scrollTop,vh=scroller.clientHeight;
  if(py<top+60||py>top+vh-90)scroller.scrollTop=py-vh*.4;
  updatePreview();
  if(S.play>=TOT){stopPlay();return}
  requestAnimationFrame(tick);
}

/* ---------- state ---------- */
function setStatus(t){$('#status').textContent=t}
function pushUndo(){undo.push(JSON.stringify(S));if(undo.length>60)undo.shift();$('#undo').disabled=false}
function save(){touched=true;setStatus('Unsaved');clearTimeout(saveT);saveT=setTimeout(doSave,700)}
async function doSave(){
  if(saving){again=true;return}
  saving=true;var j=JSON.stringify(S);
  try{localStorage.setItem(KEY,j)}catch(e){}
  if(dbDoc){try{await dbDoc.set({json:j,saved:new Date().toISOString()});setStatus('Saved')}catch(e){setStatus('Saved in this browser')}}
  else setStatus('Saved in this browser');
  saving=false;if(again){again=false;doSave()}
}
function load(o){
  if(!o||o.v!==2||!Array.isArray(o.phases)||!o.phases.length||!Array.isArray(o.blocks)||!Array.isArray(o.links))throw new Error('Not a v2 life map');
  var base=starter();base.blocks=[];base.links=[];
  var st=Object.assign(base,o),n=1;
  st.phases.concat(st.blocks,st.links).forEach(function(x){var m=+String(x.id).slice(1);if(m>=n)n=m+1});
  st.nid=Math.max(n,st.nid||1);
  var pids={};st.phases.forEach(function(p){p.dur=Math.max(1,+p.dur||1);p.h=Math.max(40,+p.h||300);pids[p.id]=1});
  st.blocks.forEach(function(b){if(!pids[b.p])b.p=st.phases[0].id;b.x=Math.max(MINX,+b.x||MINX);b.f=+b.f||0;b.off=+b.off||0;b.note=b.note||'';b.status=b.status||'built';b.path=b.path||'all'});
  S=st;sel=null;playing=false;compute();
}
function addBlock(b){
  pushUndo();
  var y=bY(b),guard=0;
  while(guard++<12&&S.blocks.some(function(o){return o.x===b.x&&Math.abs(bY(o)-y)<60}))b.x+=190;
  S.blocks.push(b);renderAll();select({k:'b',id:b.id});save();
  var e=els[b.id];if(e){var r=e.getBoundingClientRect(),s=scroller.getBoundingClientRect();if(r.left<s.left+RULER||r.right>s.right)scroller.scrollLeft+=r.left-s.left-RULER-40}
}
function custom(kind,cat,extra){var b=Object.assign({id:'b'+(S.nid++),key:null,kind:kind,cat:cat,title:'',sub:'',note:'',status:'idea',path:'all',x:LANE[cat],anchor:'el'},extra);setT(b,S.play);return b}
function delSel(){
  if(!sel)return;pushUndo();
  if(sel.k==='b'){var id=sel.id;S.blocks=S.blocks.filter(function(b){return b.id!==id});S.links=S.links.filter(function(l){return l.a!==id&&l.b!==id})}
  else{var lid=sel.id;S.links=S.links.filter(function(l){return l.id!==lid})}
  sel=null;renderAll();save();
}
function rebase(mut){var ts=S.blocks.map(bT),pt=S.play;mut();compute();S.blocks.forEach(function(b,i){setT(b,ts[i])});S.play=Math.min(pt,TOT)}
function setLife(days){
  var n=Math.max(.1,Math.min(120,+days||0));if(!n)return syncDays();
  var f=n*1440/TOT;if(Math.abs(f-1)<1e-6)return;
  pushUndo();var pf=S.play/TOT;
  S.phases.forEach(function(p){p.dur=Math.max(1,Math.round(p.dur*f))});
  compute();S.play=pf*TOT;renderAll();save();
}

/* ---------- interaction: blocks, grips, playhead ---------- */
function startDrag(e,id){
  var b=blk(id),sx=e.clientX,sy=e.clientY,ox=b.x,oy=bY(b),moved=false;
  select({k:'b',id:id});
  function mv(ev){
    var dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(!moved){if(Math.hypot(dx,dy)<4)return;moved=true;pushUndo()}
    b.x=Math.max(MINX,Math.round((ox+dx)/10)*10);setT(b,snapT(hitY(oy+dy).t));
    place(b);drawSvg();renderRuler();syncTimeInputs(b);
  }
  function up(){removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(moved){renderAll();save()}}
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
function startLink(e,id){
  e.preventDefault();
  var a=blk(id),r0=R(a),x0=r0.x+r0.w,y0=r0.y+r0.h/2,p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('class','lk lk-'+S.ltype+' tmp');svg.appendChild(p);
  function mv(ev){var r=board.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;p.setAttribute('d','M'+x0+','+y0+'C'+(x0+60)+','+y0+' '+(x-60)+','+y+' '+x+','+y)}
  function up(ev){
    removeEventListener('pointermove',mv);removeEventListener('pointerup',up);p.remove();
    var t=document.elementsFromPoint(ev.clientX,ev.clientY).map(function(n){return n.closest&&n.closest('.blk')}).find(function(n){return n&&n.dataset.id!==id});
    if(t&&!S.links.some(function(l){return l.a===id&&l.b===t.dataset.id})){pushUndo();var l={id:'l'+(S.nid++),a:id,b:t.dataset.id,type:S.ltype,label:''};S.links.push(l);select({k:'l',id:l.id});save()}
  }
  mv(e);addEventListener('pointermove',mv);addEventListener('pointerup',up);
}
function startGrip(e,i){
  e.preventDefault();e.stopPropagation();
  var p=S.phases[i],nx=S.phases[i+1],o={dur:p.dur,h:p.h,nd:nx?nx.dur:0,nh:nx?nx.h:0},sy=e.clientY,moved=false,shift=e.shiftKey,gEl=e.target.closest('.grip');
  if(gEl)gEl.classList.add('act');
  function mv(ev){
    var dy=ev.clientY-sy;
    if(!moved){if(Math.abs(dy)<2)return;moved=true;pushUndo()}
    var sq=S.mode==='squeeze'&&nx;
    if(S.view==='time'||shift){
      var dt=S.view==='time'?dy*1440/S.zoom:o.dur*dy/(o.h*S.fscale),nd=Math.max(15,o.dur+Math.round(dt/S.snap)*S.snap);
      if(Math.round(dt/S.snap)===0)nd=o.dur;
      if(sq){var tot=o.dur+o.nd;nd=Math.min(Math.max(15,nd),tot-15);nx.dur=tot-nd}
      p.dur=nd;
    }else{
      var nh=Math.max(60,o.h+dy/S.fscale);
      if(sq){var th=o.h+o.nh;nh=Math.min(nh,th-60);nx.h=th-nh}
      p.h=nh;
    }
    relayout();
    hov.hidden=false;hov.style.top=(G[i].top+G[i].h)+'px';hov.style.right='auto';hov.style.left='26px';
    hov.textContent=p.name+' '+fmt(p.dur)+(S.view==='free'&&!shift?' · '+Math.round(p.h*S.fscale)+'px':'');
  }
  function up(){removeEventListener('pointermove',mv);removeEventListener('pointerup',up);hov.hidden=true;hov.style.left='';hov.style.right='';if(gEl)gEl.classList.remove('act');if(moved){renderAll();save()}}
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
}
ruler.addEventListener('pointerdown',function(e){
  var g=e.target.closest('.grip');if(g){startGrip(e,+g.dataset.gi);return}
  e.preventDefault();
  var rect=stage.getBoundingClientRect();
  function at(ev){setPlay(hitY(ev.clientY-rect.top).t)}
  if(playing)stopPlay();
  at(e);
  function mv(ev){at(ev)}
  function up(){removeEventListener('pointermove',mv);removeEventListener('pointerup',up);save()}
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
board.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.blk');
  if(el&&e.target.closest('.port')){startLink(e,el.dataset.id);return}
  if(el){startDrag(e,el.dataset.id);return}
  if(!e.target.closest('.lbl')&&!e.target.closest('[data-lid]'))select(null);
});
board.addEventListener('click',function(e){var t=e.target.closest('[data-lid]');if(t)select({k:'l',id:t.dataset.lid})});
scroller.addEventListener('pointermove',function(e){
  if(e.buttons)return;
  var r=stage.getBoundingClientRect(),y=e.clientY-r.top;
  if(y<PAD||y>H-PAD){hov.hidden=true;return}
  hov.hidden=false;hov.style.top=y+'px';hov.textContent=fmt(hitY(y).t);
});
scroller.addEventListener('pointerleave',function(){hov.hidden=true});

/* ---------- panel events ---------- */
document.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener('click',function(){tab=b.dataset.tab;showTab()})});
function showTab(){
  document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
  $('#tab-lib').hidden=tab!=='lib';$('#tab-ph').hidden=tab!=='ph';$('#tab-fd').hidden=tab!=='fd';
  if(tab==='ph')renderPhases();if(tab==='fd'&&!$('#tab-fd').innerHTML)$('#tab-fd').innerHTML=FINDINGS;
}
libl.addEventListener('click',function(e){var b=e.target.closest('.li');if(!b)return;addBlock(mk(b.dataset.k,S.play))});
libl.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.c)openSet[d.dataset.c]=d.open?1:0},true);
$('#q').addEventListener('input',renderLib);
$('#tab-ph').addEventListener('change',function(e){
  var i=+e.target.dataset.pi,f=e.target.dataset.pf;if(isNaN(i)||!f||f==='name')return;
  var box=e.target.closest('.phc'),v=function(k){return Math.max(0,+box.querySelector('[data-pf="'+k+'"]').value||0)};
  var nd=Math.max(1,v('d')*1440+v('h')*60+v('m'));pushUndo();S.phases[i].dur=nd;renderAll();save();
});
$('#tab-ph').addEventListener('input',function(e){
  if(e.target.dataset.pf!=='name')return;var i=+e.target.dataset.pi;
  if(!burst){pushUndo();burst=true}clearTimeout(burstT);burstT=setTimeout(function(){burst=false},900);
  S.phases[i].name=e.target.value;relayout();renderInsp();updatePreview();save();
});
$('#tab-ph').addEventListener('click',function(e){
  var a=e.target.dataset.pa;if(!a)return;var i=+e.target.dataset.pi;pushUndo();
  if(a==='split')rebase(function(){var p=S.phases[i],d1=Math.max(1,Math.round(p.dur/2));S.phases.splice(i+1,0,{id:'p'+(S.nid++),name:p.name+' (b)',dur:Math.max(1,p.dur-d1),h:Math.max(60,p.h/2)});p.dur=d1;p.h=Math.max(60,p.h/2)});
  if(a==='merge')rebase(function(){var p=S.phases[i],q=S.phases[i-1];q.dur+=p.dur;q.h+=p.h;S.phases.splice(i,1)});
  if(a==='add'){S.phases.push({id:'p'+(S.nid++),name:'New phase',dur:1440,h:400})}
  renderAll();save();
});
insp.addEventListener('input',function(e){
  var f=e.target.dataset.f;if(!f||!sel||e.target.tagName==='SELECT')return;
  if(!burst){pushUndo();burst=true}clearTimeout(burstT);burstT=setTimeout(function(){burst=false},900);
  var v=e.target.value;
  if(sel.k==='l'){var l=lk(sel.id);if(!l)return;l[f]=v;drawSvg();save();return}
  var b=blk(sel.id);if(!b)return;
  if(f==='td'||f==='th'||f==='tmi'){
    var g=function(k){return +insp.querySelector('[data-f="'+k+'"]').value||0};
    setT(b,g('td')*1440+g('th')*60+g('tmi'));renderBlock(b);renderRuler();drawSvg();updatePreview();save();return;
  }
  b[f]=v;renderBlock(b);drawSvg();updatePreview();if(f==='text'||f==='title')renderLib();save();
});
insp.addEventListener('change',function(e){
  var f=e.target.dataset.f;if(!f||!sel||e.target.tagName!=='SELECT')return;pushUndo();var v=e.target.value;
  if(sel.k==='l'){var l=lk(sel.id);if(l){l[f]=v;drawSvg();save()}return}
  var b=blk(sel.id);if(!b)return;
  if(f==='anchor'){var t=bT(b);b.anchor=v;setT(b,t)}else b[f]=v;
  renderAll();save();
});
insp.addEventListener('click',function(e){
  var a=e.target.dataset.act;if(!a||!sel)return;
  if(a==='del')delSel();
  if(a==='flip'){var l=lk(sel.id);if(l){pushUndo();var t=l.a;l.a=l.b;l.b=t;drawSvg();renderInsp();save()}}
  if(a==='jump'&&sel.k==='b'){setPlay(bT(blk(sel.id)))}
  if(a==='dup'&&sel.k==='b'){var b=blk(sel.id),c=JSON.parse(JSON.stringify(b));c.id='b'+(S.nid++);c.x=b.x+190;addBlock(c)}
});
$('#nx').addEventListener('click',function(e){var b=e.target.closest('[data-jump]');if(!b)return;if(playing)stopPlay();setPlay(+b.dataset.jump);var x=blk(b.dataset.bid);if(x){select({k:'b',id:x.id});scroller.scrollTop=bY(x)+28-scroller.clientHeight*.4}});

/* ---------- toolbar ---------- */
$('#ltype').innerHTML=opts(LT,'unlock');
document.querySelectorAll('[data-d]').forEach(function(b){b.addEventListener('click',function(){setLife(b.dataset.d)})});
$('#days').addEventListener('change',function(e){setLife(e.target.value)});
function setView(v){if(S.view===v)return;var ct=hitY(scroller.scrollTop+scroller.clientHeight/2-28).t;S.view=v;renderAll();scroller.scrollTop=yOfT(ct)+28-scroller.clientHeight/2;save()}
$('#vFree').addEventListener('click',function(){setView('free')});
$('#vTime').addEventListener('click',function(){setView('time')});
$('#zoom').addEventListener('input',function(e){
  var ct=hitY(scroller.scrollTop+scroller.clientHeight/2-28).t;
  if(S.view==='time')S.zoom=+e.target.value;else S.fscale=+e.target.value;
  relayout();scroller.scrollTop=yOfT(ct)+28-scroller.clientHeight/2;save();
});
$('#fit').addEventListener('click',function(){
  var avail=scroller.clientHeight-28-PAD*2-10;
  if(S.view==='time')S.zoom=Math.max(1,avail/(TOT/1440));
  else{var sum=S.phases.reduce(function(a,p){return a+p.h},0);S.fscale=Math.max(.05,avail/sum)}
  renderAll();scroller.scrollTop=0;save();
});
$('#mode').addEventListener('change',function(e){S.mode=e.target.value;save()});
$('#snap').addEventListener('change',function(e){S.snap=+e.target.value;save()});
$('#ltype').addEventListener('change',function(e){S.ltype=e.target.value;save()});
$('#path').addEventListener('change',function(e){S.path=e.target.value;renderAll();save()});
$('#focus').addEventListener('click',function(){S.focus=!S.focus;renderAll();save()});
$('#speed').addEventListener('change',function(e){S.speed=+e.target.value;save()});
$('#play').addEventListener('click',function(){playing?stopPlay():startPlay()});
$('#addCap').addEventListener('click',function(){addBlock(custom('cap','cap',{title:'Caption',text:'NEW\nCAPTION'}))});
$('#addNot').addEventListener('click',function(){addBlock(custom('notif','notif',{title:'Notification',nt:'SHADE',cl:'',text:''}))});
$('#addBr').addEventListener('click',function(){addBlock(custom('br','branch',{title:'Branch condition',status:'built'}))});
function doUndo(){if(!undo.length)return;S=JSON.parse(undo.pop());sel=null;renderAll();save()}
$('#undo').addEventListener('click',doUndo);
var rt=0;
$('#reset').addEventListener('click',function(e){
  var b=e.target;
  if(b.dataset.arm){clearTimeout(rt);b.dataset.arm='';b.textContent='Reset';pushUndo();playing=false;starter();sel=null;renderAll();save();return}
  b.dataset.arm='1';b.textContent='Confirm reset';rt=setTimeout(function(){b.dataset.arm='';b.textContent='Reset'},3000);
});
addEventListener('keydown',function(e){
  if(e.target.matches&&e.target.matches('input,textarea,select'))return;
  if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();delSel()}
  else if(e.key==='Escape')select(null);
  else if(e.key===' '){e.preventDefault();playing?stopPlay():startPlay()}
  else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();doUndo()}
});

var modal=$('#modal'),jtxt=$('#jtxt'),jmsg=$('#jmsg');
$('#json').addEventListener('click',function(){jtxt.value=JSON.stringify(S,null,1);jmsg.textContent='';modal.hidden=false});
$('#jclose').addEventListener('click',function(){modal.hidden=true});
$('#jcopy').addEventListener('click',function(){
  jtxt.select();
  (navigator.clipboard?navigator.clipboard.writeText(jtxt.value):Promise.reject()).then(function(){jmsg.textContent='Copied'},function(){jmsg.textContent='Text selected. Copy it with your keyboard.'});
});
$('#jsave').addEventListener('click',async function(){
  try{var d=window.claude&&await window.claude.use('downloads');if(!d)throw 0;await d.save({filename:'lil-lazy-life-map_'+stamp()+'.json',data:jtxt.value});jmsg.textContent='Saved'}
  catch(e){jmsg.textContent=(e&&e.code==='declined')?'Save cancelled':'File saving is not available here. Use Copy.'}
});
function loadText(t){try{pushUndo();load(JSON.parse(t));renderAll();save();modal.hidden=true}catch(e){undo.pop();jmsg.textContent='Could not load: '+e.message}}
$('#jload').addEventListener('click',function(){loadText(jtxt.value)});
$('#jpick').addEventListener('click',function(){$('#jfile').click()});
$('#jfile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){loadText(String(r.result))};r.readAsText(f);e.target.value=''});

async function initDb(){
  try{
    var c=window.claude;if(!c||!c.use)return;
    var db=await c.use('db');if(!db)return;
    dbDoc=db.doc('maps/v2');
    var snap=await dbDoc.get();
    if(snap.exists&&!touched){var j=snap.data().json;if(j){load(JSON.parse(j));renderAll()}}
    setStatus('Saved');
  }catch(e){dbDoc=null}
}

(function boot(){
  var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  try{if(raw)load(JSON.parse(raw));else starter()}catch(e){starter()}
  renderHdr();showTab();renderAll();setStatus('Not saved yet');initDb();
})();
})();
</script>
